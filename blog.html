.container, blockquote, div.blockquote {
    background-color: transparent;
    border: none;
    padding: 7px;
    position: relative;
    right: 0px;
    min-height: 2rem;
    margin-bottom: 12px;
}
:where(.container, blockquote, div.blockquote)::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    box-sizing: border-box;
    width: 100%; height: 100%;
    border: solid 0.1rem rgb(var(--space-moon));
    clip-path: polygon(100% 0, 100% 100%, 0 100%, 0 1.425rem, 1.125rem 0);
    pointer-events: none;
}
:where(.container, blockquote, div.blockquote)::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    box-sizing: border-box;
    width: 2rem; height: 2rem;
    background-color: rgb(var(--space-moon));
    -webkit-mask-image: var(--space-star-mask);
    -webkit-mask-size: contain;
    -webkit-mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-image: var(--space-star-mask);
    mask-size: contain;
    mask-position: center;
    mask-repeat: no-repeat;
    transform: translate(-50%, -42.5%);
}
h1 {

:is(h1)::before,

}

    min-width: 1.75rem;

    -webkit-mask-repeat: no-repeat;

    -webkit-mask-position: center;
    mask-image: var(--heading-mask);
    mask-repeat: no-repeat;
    mask-size: contain;
    mask-position: center;
}
